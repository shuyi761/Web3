<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优品商城 - 首页</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="header-left">
                    <span>欢迎来到优品商城</span>
                </div>
                <div class="header-right">
                    <a href="html/login.html" id="login-link">登录</a>
                    <span>|</span>
                    <a href="html/login.html" id="register-link">注册</a>
                    <span>|</span>
                    <a href="html/user.html" id="profile-link" style="display: none;">个人中心</a>
                    <span id="user-name" style="display: none;"></span>
                </div>
            </div>
        </div>
        <div class="header-main">
            <div class="container">
                <div class="logo">
                    <h1><a href="index.html">优品商城</a></h1>
                </div>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索商品...">
                    <button id="search-btn"><i class="fas fa-search"></i></button>
                    <div class="search-suggestions" id="search-suggestions">
                        <!-- 搜索推荐将通过JS动态加载 -->
                    </div>
                </div>
                <div class="header-icons">
                    <div class="help-center">
                        <a href="#" class="help-icon">
                            <i class="fas fa-question-circle"></i>
                            <span>帮助中心</span>
                        </a>
                        <div class="help-dropdown">
                            <a href="#" class="help-item"><i class="fas fa-headset"></i> 官方客服</a>
                            <a href="#" class="help-item"><i class="fas fa-store"></i> 商家客服</a>
                            <a href="#" class="help-item"><i class="fas fa-bell"></i> 消息中心</a>
                            <a href="#" class="help-item"><i class="fas fa-comments"></i> 意见反馈</a>
                            <a href="#" class="help-item"><i class="fas fa-flag"></i> 举报中心</a>
                            <a href="#" class="help-item"><i class="fas fa-file-alt"></i> 规则</a>
                        </div>
                    </div>
                    <a href="html/cart.html" class="cart-icon">
                        <i class="fas fa-shopping-cart"></i>
                        <span id="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
        <nav class="nav">
            <div class="container">
                <ul class="nav-list">
                    <li><a href="#" class="active" data-category="all">全部商品</a></li>
                    <li><a href="#" data-category="electronics">电子产品</a></li>
                    <li><a href="#" data-category="clothing">服装服饰</a></li>
                    <li><a href="#" data-category="fresh">生鲜食品</a></li>
                    <li><a href="#" data-category="home">家居用品</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- 轮播图 -->
    <section class="carousel">
        <div class="container">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="images/实验1-小兔鲜儿所用图片/banner1.png" alt="轮播图1">
                </div>
                <div class="carousel-item">
                    <img src="images/实验1-小兔鲜儿所用图片/fresh_goods_1.jpg" alt="轮播图2">
                </div>
                <div class="carousel-item">
                    <img src="images/实验1-小兔鲜儿所用图片/new_goods_1.jpg" alt="轮播图3">
                </div>
            </div>
            <button class="carousel-prev"><i class="fas fa-chevron-left"></i></button>
            <button class="carousel-next"><i class="fas fa-chevron-right"></i></button>
            <div class="carousel-indicators">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </section>

    <!-- 商品分类 -->
    <section class="categories">
        <div class="container">
            <h2>商品分类</h2>
            <div class="category-grid">
                <div class="category-item" data-category="electronics">
                    <img src="images/实验1-小兔鲜儿所用图片/hot1.png" alt="电子产品">
                    <span>电子产品</span>
                </div>
                <div class="category-item" data-category="clothing">
                    <img src="images/实验1-小兔鲜儿所用图片/clothes1.png" alt="服装服饰">
                    <span>服装服饰</span>
                </div>
                <div class="category-item" data-category="fresh">
                    <img src="images/实验1-小兔鲜儿所用图片/fresh1.png" alt="生鲜食品">
                    <span>生鲜食品</span>
                </div>
                <div class="category-item" data-category="home">
                    <img src="images/实验1-小兔鲜儿所用图片/home1.png" alt="家居用品">
                    <span>家居用品</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 热门商品 -->
    <section class="products">
        <div class="container">
            <h2>热门商品</h2>
            <div class="product-grid" id="product-grid">
                <!-- 商品将通过JS动态加载 -->
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>关于我们</h3>
                    <p>优品商城致力于为用户提供优质的购物体验</p>
                </div>
                <div class="footer-section">
                    <h3>联系方式</h3>
                    <p>客服热线:400-123-4567</p>
                    <p>邮箱:service@youpin.com</p>
                </div>
                <div class="footer-section">
                    <h3>版权信息</h3>
                    <p>学号:24215220235</p>
                    <p>姓名：梁鸿毅</p>
                    <p>&copy; 2024 优品商城 版权所有</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- 返回顶部按钮 -->
    <button id="back-to-top"><i class="fas fa-arrow-up"></i></button>

    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
