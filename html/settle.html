<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优品商城 - 结算下单</title>
    <link rel="stylesheet" href="../css/order.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-main">
            <div class="container">
                <div class="logo">
                    <h1><a href="../index.html">优品商城</a></h1>
                </div>
                <div class="header-icons">
                    <a href="cart.html" class="cart-icon">
                        <i class="fas fa-shopping-cart"></i>
                        <span id="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- 结算页面 -->
    <section class="settle-section">
        <div class="container">
            <h2>确认订单</h2>
            
            <div class="settle-content">
                <!-- 收货地址 -->
                <div class="address-section">
                    <h3>收货地址</h3>
                    <div class="address-box">
                        <div class="address-item active">
                            <input type="radio" name="address" checked>
                            <div class="address-info">
                                <span class="address-name">张三</span>
                                <span class="address-phone">13800138000</span>
                                <p class="address-detail">北京市朝阳区xxx街道xxx小区1号楼101室</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 商品清单 -->
                <div class="order-items">
                    <h3>商品清单</h3>
                    <table class="order-table">
                        <thead>
                            <tr>
                                <th>商品图片</th>
                                <th>商品名称</th>
                                <th>单价</th>
                                <th>数量</th>
                                <th>小计</th>
                            </tr>
                        </thead>
                        <tbody id="order-items">
                            <!-- 订单商品将通过JS动态加载 -->
                        </tbody>
                    </table>
                </div>
                
                <!-- 订单金额 -->
                <div class="order-summary">
                    <div class="summary-row">
                        <span>商品金额</span>
                        <span id="subtotal">¥0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>运费</span>
                        <span id="shipping">¥0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>应付金额</span>
                        <span id="total">¥0.00</span>
                    </div>
                </div>
                
                <!-- 支付方式 -->
                <div class="payment-section">
                    <h3>支付方式</h3>
                    <div class="payment-options">
                        <label class="payment-option">
                            <input type="radio" name="payment" value="alipay" checked>
                            <i class="fab fa-alipay"></i>
                            <span>支付宝</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="wechat">
                            <i class="fab fa-weixin"></i>
                            <span>微信支付</span>
                        </label>
                    </div>
                </div>
                
                <!-- 提交订单 -->
                <div class="submit-section">
                    <button id="submit-order">提交订单</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>版权信息</h3>
                    <p>学号：24215220235</p>
                    <p>姓名：梁鸿毅</p>
                    <p>&copy; 2024 优品商城 版权所有</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/common.js"></script>
    <script src="../js/settle.js"></script>
</body>
</html>
