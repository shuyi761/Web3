<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优品商城 - 购物车</title>
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="header-left">
                    <span>欢迎来到优品商城</span>
                </div>
                <div class="header-right">
                    <a href="login.html" id="login-link">登录</a>
                    <span>|</span>
                    <a href="login.html" id="register-link">注册</a>
                    <span>|</span>
                    <a href="user.html" id="profile-link" style="display: none;">个人中心</a>
                    <span id="user-name" style="display: none;"></span>
                </div>
            </div>
        </div>
        <div class="header-main">
            <div class="container">
                <div class="logo">
                    <h1><a href="../index.html">优品商城</a></h1>
                </div>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索商品...">
                    <button id="search-btn"><i class="fas fa-search"></i></button>
                </div>
                <div class="header-icons">
                    <a href="cart.html" class="cart-icon">
                        <i class="fas fa-shopping-cart"></i>
                        <span id="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- 购物车内容 -->
    <section class="cart-section">
        <div class="container">
            <h2>我的购物车</h2>
            
            <div class="cart-content">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all"> 全选</th>
                            <th>商品图片</th>
                            <th>商品名称</th>
                            <th>单价</th>
                            <th>数量</th>
                            <th>小计</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- 购物车商品将通过JS动态加载 -->
                    </tbody>
                </table>
                
                <div class="cart-summary">
                    <div class="summary-left">
                        <button id="clear-cart">清空购物车</button>
                    </div>
                    <div class="summary-right">
                        <span>合计：</span>
                        <span class="total-price" id="cart-total">¥0.00</span>
                        <button id="checkout-btn" disabled>去结算</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>版权信息</h3>
                    <p>学号：24215220235</p>
                    <p>姓名：梁鸿毅</p>
                    <p>&copy; 2024 优品商城 版权所有</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/common.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
